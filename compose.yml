services:
  studio:
    build: .
    env_file: ${STUDIO_ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
    restart: unless-stopped
    volumes:
      - studio_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/studio/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: [production]
    environment:
      STUDIO_ORIGIN_HOST: ${STUDIO_ORIGIN_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy

volumes:
  studio_data:
  caddy_data:
  caddy_config:
