[project]
name = "blogstudio"
version = "0.1.0"
description = "Private Google-authenticated editor for a GitHub Pages blog"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "authlib>=1.6.6,<2", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.22,<1",
  "pyyaml>=6.0.2,<7", "pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
